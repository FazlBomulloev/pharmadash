server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # В приложении нет своей авторизации — закрываем всё целиком
    auth_basic "Evolytics";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Загрузка xlsx рынков (файлы по 5–10 МБ, с запасом)
    client_max_body_size 200m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Импорт рынка и тяжёлые отчёты считаются долго
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Файлы сборки Vite содержат хеш в имени — можно кешировать навсегда
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: прямой заход на вложенный роут отдаёт index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
